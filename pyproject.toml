[project]
name = "quran-reels"
version = "0.1.0"
description = "Daily Quran passage reels: recitation, Uthmani text, translation and word meanings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "playwright>=1.45",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# quran-reels split: torch from https://download.pytorch.org/whl/cpu (CPU only, ~200 MB)
asr = ["torch>=2.4", "transformers>=4.45"]

[project.scripts]
quran-reels = "quran_reels.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quran_reels = ["render/templates/*", "sources/scenes/*.frag", "sources/scenes/*.glsl",
               "catalog/history.yaml", "catalog/site/*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
