# Statistics of the Page (docs/insights.md): read every night by the insights workflow,
# after prepare-splits, and shown on the catalogue's « Statistiques » page. Read only: nothing
# is posted or changed on Facebook or Instagram. Owner's choice (2026-11-15): public, like the
# rest of the state branch and the catalogue.

enabled: true
days: 35                   # posts published in the last 35 days are read
refresh_days: 8            # read every night until this age (the « latest » column)
checkpoints:               # a snapshot kept for good the first night after each age (hours):
  48h: 48                  # the owner's sheet (docs/retention/calendar.md of quran-themes-demo)
  7d: 168                  # a film, a week later
  28d: 672                 # what stays
tolerance_hours: 48        # a checkpoint missed for longer is left empty, never back-filled
max_usage: 75              # % of the Meta app's hourly budget (X-App-Usage): stop reading above
max_calls: 150             # and never more calls than this in one run

themes:                    # the videos of quran-themes-demo, published on the same Page
  repo: mssnoussi92/quran-themes-demo
  ref: main
  calendar: docs/retention/calendar.md          # « Le calendrier » table: date, what, where
  texts: docs/retention                         # publication-*.md: title, file, duration
  time: "18:00"                                 # Paris (owner, 2026-11-19; 19:00 before)

youtube:                   # the channel's numbers, read only (insights/youtube.py; owner's choice,
                           # 2026-11-15): read when YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET and
                           # YOUTUBE_REFRESH_TOKEN are set (workflow youtube-auth, docs/plateformes.md)
  redirect_uri: https://mssnoussi92.github.io/quran-reels/youtube-callback.html
  lag_days: 2              # the checkpoints (48 h, 7 days, 28 days) are counted on YouTube Analytics'
                           # days (Pacific time) once the last of them is this old

compare:                   # the dashboard's rule (docs/retention.md of quran-themes-demo,
  min_videos: 3            # « Mesurer »): fewer videos, or a smaller gap in points, and no
  min_points: 12           # difference is claimed between two kinds of video

# The dashboard (catalog/dashboard.py, owner's choice 2026-11-21). Both lists are meant to change:
# a session adds a trial the day a change ships, and a source the day one is found
# (continuous improvement, CLAUDE.md).
trials:                    # « Essais en cours »; with `platforms`, a before / after of the 48 h
                           # `metric` (default views) over `days` (default 14) each side, for the
                           # videos of `kinds` (a kind, or a group: Reels, Shorts thématiques, Films)
  - what: Titres YouTube en arabe d'abord
    since: 2026-11-21
    where: YouTube (nouveaux titres ; les anciens renommés à la main)
    judge: part des vues venues de la recherche, puis le taux de clics des exports de Studio
    platforms: [youtube]
    kinds: [Reels, Shorts thématiques]
    metric: search_pct
  - what: Légende Instagram sans les versets
    since: 2026-11-22
    where: Instagram (reels)
    judge: vues à 48 h des reels, avant / après ; le même jour, la tête de légende passe à l'arabe
      d'abord (les deux changements ne se séparent pas)
    platforms: [instagram]
    kinds: [Reels]
  - what: Titres et descriptions en arabe d'abord sur Facebook, Instagram et TikTok
    since: 2026-11-22
    where: reels et vidéos thématiques
    judge: vues à 48 h, avant / après ; sur Instagram, la légende perd ses versets le même jour (les deux
      changements ne se séparent pas)
    platforms: [facebook, instagram]
    kinds: [Reels, Shorts thématiques]
  - what: Shorts du calendrier mis en ligne par le run, langue arabe et sous-titres exacts
    since: 2026-11-22
    where: "YouTube (les reels) ; trois changements le même jour, qui ne se séparent pas"
    judge: "vues à 48 h et part de la recherche, avant / après (titre et description ne changent pas ;
      ce qui change : l'heure, vers 07:40 au lieu de 9 h à 12 h 30 à la main, la langue déclarée, les
      sous-titres du mushaf et de Sahih International)"
    platforms: [youtube]
    kinds: [Reels]
  - what: Vidéos thématiques à 13:00 au lieu de 18:00
    since: 2026-11-27
    where: "toutes les plateformes (le run publie d'un coup) ; choix du propriétaire, 2026-11-21, d'après
      les heures de ses spectateurs YouTube (Studio, 14 h à 16 h en semaine)"
    judge: vues à 48 h des vidéos thématiques, avant / après, sur chaque plateforme
    platforms: [youtube, facebook, instagram]
    kinds: [Shorts thématiques]
  - what: Omar Hisham d'abord quand sa découpe est vérifiée
    since: 2026-11-22
    where: toutes les plateformes sauf YouTube
    judge: l'audit par récitateur
  - what: Miniatures dessinées des films
    since: 2026-11-23
    where: YouTube (Moussa et al-Khadir, à changer dans Studio ; Dhul-Qarnayn le 23, la caverne le 30)
    judge: taux de clics des films (exports de Studio), avant / après
    platforms: [youtube]
    kinds: [Films]
  - what: Version courte des shorts de Dhul-Qarnayn
    since: 2026-11-24
    where: Facebook, Instagram, YouTube (24 au 26 novembre)
    judge: l'audit « version courte contre short entier », à la revue du 29 novembre
  - what: Légendes Facebook en 400 caractères
    since: 2026-11-23
    where: "Facebook, vidéos thématiques (ligne de la voix IA plus courte, trois accroches resserrées ; décision du
      propriétaire à la revue du 2026-11-22, quran-themes-demo PR #89)"
    judge: "la remarque « légendes de qualité » de Meta (captures) ; vues à 48 h des vidéos thématiques sur Facebook, avant /
      après (l'heure change aussi le 27 novembre)"
    platforms: [facebook]
    kinds: [Shorts thématiques, Films]
  - what: Vidéos thématiques sans bande sombre (bordures)
    since: 2026-12-01
    where: "Facebook d'abord : les trois shorts de la caverne (1er au 3 décembre), gabarit de quran-themes-demo corrigé ;
      décision du propriétaire à la revue du 2026-11-22"
    judge: "la remarque « vidéo avec bordures » de Meta sur ces shorts (captures) ; leurs vues à 48 h sur Facebook contre les
      shorts thématiques d'avant, à la revue du 6 décembre"
    platforms: [facebook]
    kinds: [Shorts thématiques]
  - what: Page test « معاك 5 ثواني » (un seul type de vidéo)
    since: 2026-11-19
    where: sa propre page Facebook et Instagram
    judge: ses quiz contre le quiz de la Page, à partir du 23 novembre (insights-ma3ak.json)
  # The question on a word (video.hook) and the Arabic hashtags first on Instagram and TikTok (owner's
  # choice, 2026-11-23, after the trailer and his screenshots of the audience: docs/insights.md, « La
  # question du mot »). Three lines: what each platform is judged on.
  - what: "Question du mot au début des reels du matin : Instagram, partages (hashtags arabes d'abord)"
    since: 2026-11-24
    where: "reels du matin : Facebook, Instagram, TikTok ; YouTube sans la question (témoin)"
    judge: "partages et enregistrements à 48 h ; pays du public (captures « Audience » de 2 ou 3 reels) :
      la question écrite suffit-elle à Instagram pour les montrer aux pays arabes ?"
    platforms: [instagram]
    kinds: [Reels]
    metric: shares
  - what: "Question du mot : vues à 48 h, Facebook et YouTube (témoin, sans la question)"
    since: 2026-11-24
    where: "reels du matin"
    judge: "Facebook avec la question contre YouTube sans : un changement des deux à la fois n'est pas la question"
    platforms: [facebook, youtube]
    kinds: [Reels]
  - what: "Question du mot : TikTok, durée moyenne regardée (hashtags arabes d'abord)"
    since: 2026-11-24
    where: "reels du matin (public européen : la question en anglais compte)"
    judge: "durée moyenne regardée et vues complètes des captures, contre 2,9 à 3,6 s avant"
    platforms: [tiktok]
    kinds: [Reels]
    metric: avg_watch
  - what: "Légende TikTok tout en arabe (une semaine)"
    since: 2026-11-24
    days: 7
    where: "TikTok, les reels du 24 au 30 novembre (platforms.tiktok.arabic_only)"
    judge: "les pays des spectateurs (captures « Spectateurs → Emplacements » de 2 ou 3 reels) contre le Royaume-Uni
      à 47 % de 101:1-11 ; l'écran du mot part le même jour (choix du propriétaire) : la voix arabe seule n'avait pas
      changé les pays de la bande-annonce"
    platforms: [tiktok]
    kinds: [Reels]

missing:                   # « Données manquantes »: what the page lacks and how it comes; `look`
                           # finds the last manual entry that brought it (none: not done yet)
  - what: Impressions et taux de clics des miniatures (YouTube)
    how: export « Contenu » de YouTube Studio (le zip), envoyé dans n'importe quelle session
    often: une fois par semaine
    look: {platform: youtube, metric: ctr}
  - what: « Ont choisi de regarder » contre « balayées » (Shorts YouTube)
    how: le même export, avec cette colonne ajoutée dans le mode avancé de Studio
    often: une fois par semaine
    look: {platform: youtube, metric: viewed_pct}
  - what: TikTok (vues, durée moyenne, vues complètes, abonnés)
    how: captures de TikTok Studio, la liste « Contenu » et deux ou trois vidéos
    often: une fois par semaine
    look: {platform: tiktok}
  - what: Portée des reels Facebook
    how: export « Contenu » de Meta Business Suite (l'API la refuse pour les reels)
    often: une fois par semaine
    look: {platform: facebook, metric: reach}
  - what: Âge, sexe et pays des abonnés Facebook et Instagram
    how: l'API Meta les donne (Instagram à partir de 100 abonnés) ; pas encore lus
    often: chaque nuit, à ajouter au relevé
