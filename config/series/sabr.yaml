# PROPOSAL, to be validated by the owner: remove a line to drop a passage, reorder freely.
# Made from the 93 ayahs that contain the root ص ب ر (patience; quran.ai concordance,
# 2026-11-06), keeping those where patience is commanded, praised or rewarded, as whole
# sentences. Left out: the «patience» of the people of the Fire or of idolaters (2:175, 14:21,
# 25:42, 38:6, 41:24, 52:16), the dialogue of Musa and al-Khidr (18:67-82), rulings and
# battle numbers (4:25, 8:65-66), Juz' 'Amma (read in the morning: 90:17, 103:3) and the
# passages of other series (2:250, 7:126: du'a); 13:22-24 starts mid-sentence (13:19-24 is
# over 90 s). Mushaf order.
title_ar: آيات الصبر
title_en: Patience (sabr) in the Quran
hashtags: ["#Sabr", "#الصبر"]
passages:
  - "2:45-46"      # seek help through patience and prayer
  - "2:153"        # «Allah is with the patient»
  - "2:155-157"    # the test, and good tidings to the patient
  - "3:186"        # «that is of the matters of determination»
  - "3:200"        # «be patient and persevere»
  - "7:128"        # Musa to his people: seek help through Allah and be patient
  - "8:46"         # do not dispute, and be patient
  - "11:9-11"      # except those who are patient and do righteous deeds
