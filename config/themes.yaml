# The theme videos of quran-themes-demo, published on the Page by the workflow `themes`
# (docs/themes.md). Owner's decision, 2026-11-15: Facebook and Instagram after Meta's copyright
# check, TikTok as a draft in the inbox (the owner posts it); YouTube by hand until 2026-11-21, then
# uploaded by the run too (owner's choice, 2026-11-21: shorts and films; a film's 16:9 version goes
# on the check of its 9:16 twin, same sound).
#
# What and when: docs/retention/calendar.md of quran-themes-demo, as written (« Le calendrier »);
# the texts: its publication-<doc>.md; the files: its public pre-release page-<doc> (workflow
# page-files, run once the owner has validated). Nothing is generated here.

enabled: true
from: 2026-11-19           # first day published automatically (owner's choice, 2026-11-19: today, the third
                           # short of the du'a, rather than 2026-11-23, the film of Dhul-Qarnayn);
                           # before it the owner publishes by hand, and the run never touches it
repo: mssnoussi92/quran-themes-demo
ref: main
calendar: docs/retention/calendar.md
texts: docs/retention
release_prefix: page-      # https://github.com/<repo>/releases/download/page-<doc>/<file>
time: "18:00"              # Paris (owner's request, 2026-11-19: 18:00 like the test page; before: 19:00,
                           # his decision of 2026-11-13)
times:                     # from a day on, another hour (themepub/run.py, time_for)
  - from: 2026-11-22       # the channel's trailer, Sunday 22 at 14:00 (owner's request, 2026-11-22: « publie-les
    time: "14:00"          # automatiquement », the hour the session advised: before his Sunday peak, between the
  - from: 2026-11-23       # 07:30 reel and the 18:00 one); the next day, 18:00 again
    time: "18:00"
  - from: 2026-11-27       # owner's choice, 2026-11-21: 13:00, an hour before his YouTube viewers' peak
    time: "13:00"          # (14:00-16:00 Paris on weekdays, Studio « Quand vos spectateurs sont sur
                           # YouTube »); after the short versions of Dhul-Qarnayn (24-26) so the two
                           # trials do not mix; every platform, the run publishes them at once
early_minutes: 20          # a run up to 20 min before takes the day's video
window_hours: 3            # after that, the day's video is missed (an alert says so)
platforms: [facebook, instagram, tiktok, youtube]
youtube:                   # publishers/youtube.py: its own token, YOUTUBE_UPLOAD_REFRESH_TOKEN
  privacy: public
  made_for_kids: false
  synthetic_media: false   # owner's choice, 2026-11-21: « Non »: a narrator's synthetic voice that
                           # imitates no one is not the realistic content YouTube asks about; every
                           # description already says the voice is AI-generated
  language: ar             # Egyptian Arabic narration, Arabic recitation (owner, 2026-11-21)
  # category: "27"         # unset: YouTube's default, as for the uploads by hand
reels_max_seconds: 900     # Facebook: up to 15 min through the Reels API, with Meta's rights check on the
                           # unpublished reel. Dry runs of 2026-11-15: a 2:05 short and the 8:24 film taken
                           # as reels, check « complete, aucune correspondance »; as Page videos
                           # (/videos, facebook_video.py, still used beyond this) Meta gave no check in
                           # 10 min, so nothing would have been published.
instagram_processing_seconds: 1200   # a 2-minute video is still processing after 4 min (dry run of
                                     # 2026-11-15: three uploads given up at 240 s each); one upload,
                                     # waited for, rather than new containers
