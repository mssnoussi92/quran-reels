# Editorial and technical choices. Change here, not in the code.

project:
  name: Quran Words Daily
  handles:
    facebook: quranwordsdaily
    instagram: quran_words_daily
    tiktok: quran_words_daily
    youtube: "@quran_words_daily"

content:
  quran_text:
    edition: ar-uthmani-hafs          # canonical text, never generated
    source: quran.com                 # text_uthmani of the Quran.com API v4
  translation:
    edition: en-sahih-international   # Quran.com translation slug
    source: quran.com
    label: Sahih International
  glosses:
    edition: ar-ghareeb-ibn-qutaybah
    source: tafsir.app
    source_id: ghareeb-ibn-qutaybah   # tafsir.app book id
    label: "ابن قتيبة، تفسير غريب القرآن"
    hashtags: ["#تفسير_القرآن", "#غريب_القرآن"]   # when a word meaning is shown
    max_per_ayah: 2                   # entries shown under one ayah
    max_chars: 170                    # whole sentences only, an entry longer than this is left out
  reciter:
    id: Alafasy_128kbps               # EveryAyah folder name
    label: Mishary Rashid Alafasy
    hashtags: ["#Alafasy", "#مشاري_العفاسي"]
    timings_id: 7                     # Quran.com chapter recitation, same recording (planning)
  basmala:
    enabled: true                     # recited and shown at the start of every video
    audio: bismillah                  # EveryAyah file of the reciter: bismillah.mp3
    skip_surahs: [9]                  # At-Tawbah has no basmala (also none before 1:1, it is 1:1)
  passage:
    mode: complete                    # never cut a passage mid-sentence
    target_seconds: 60                # about one minute
    min_seconds: 40
    max_seconds: 90                   # Facebook Reels API limit
    whole_surah: true                 # a surah that fits in max_seconds is one video, any length
    groups: en-tafisr-ibn-kathir      # Quran.com tafsir whose ayah groups are never split (sic)

video:
  width: 1080
  height: 1920
  fps: 30
  safe_area: { top: 250, bottom: 420, sides: 90 }
  highlight_color: "#f6c86b"
  lead_seconds: 0.4                   # first ayah on screen before the recitation starts
  tail_seconds: 1.2                   # last ayah stays after it ends
  fade_seconds: 0.25                  # ayah text fades in and out
  handle: "@quran_words_daily"        # page signature shown on every frame

platforms:
  meta:
    graph_version: v24.0              # Graph API version, Facebook and Instagram
    min_days_left: 14                 # fail when the token's data access expires sooner
  facebook:  { enabled: true,  mode: auto, max_hashtags: 8 }
  instagram: { enabled: true,  mode: auto, max_hashtags: 5 }   # Instagram's cap since 12/2025
  tiktok:
    enabled: true                     # tiktok-auth saved TIKTOK_REFRESH_TOKEN (2026-11-04)
    mode: draft                       # inbox upload, posted by hand from the TikTok app
    max_hashtags: 5                   # TikTok accepts 5 (seen by the owner, 2026-11-05)
    redirect_uri: https://mssnoussi92.github.io/quran-reels/tiktok-callback.html
  youtube:   { enabled: false, mode: manual }  # locked private until the YouTube audit

# Hashtags at the end of every caption, in this order (the first ones are kept when a platform
# allows fewer): brand, broad[0], the series' first tag, the surah (#SurahAdDuhaa,
# #سورة_الضحى, from Quran.com's names), the other broad tags, the other series tags, the
# reciter's, the glosses' (content.*.hashtags). caption.txt keeps them all (TikTok, YouTube).
captions:
  brand: "#QuranWordsDaily"           # on every video, so that the series can be found
  broad: ["#Quran", "#القرآن_الكريم"]

# When and what to publish: config/schedule.yaml (slots) and config/series/ (series).
