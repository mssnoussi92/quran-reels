# Editorial and technical choices. Change here, not in the code.

project:
  name: Quran Words Daily
  handles:
    facebook: quranwordsdaily
    instagram: quran_words_daily
    tiktok: quran_words_daily
    youtube: "@quran_words_daily"

content:
  quran_text:
    edition: ar-uthmani-hafs          # canonical text, never generated
    source: quran.com                 # text_uthmani of the Quran.com API v4
  translation:
    edition: en-sahih-international   # Quran.com translation slug
    source: quran.com
    label: Sahih International
  glosses:                            # word meanings (owner's choice, 2026-11-05)
    edition: ar-tafsir-muyassar-ghareeb   # غريب التفسير الميسر, King Fahd Complex
    source: tafsir.app
    source_id: almuyassar-ghareeb     # tafsir.app book id (was ghareeb-ibn-qutaybah)
    label: "التفسير الميسر، مجمع الملك فهد"
    label_en: "Tafsir al-Muyassar, King Fahd Complex"   # image captions
    hashtags: ["#تفسير_القرآن", "#التفسير_الميسر"]   # when a word meaning is shown
    max_per_ayah: 2                   # entries shown under one ayah
    max_chars: 170                    # whole sentences only, an entry longer than this is left out
    max_words: 3                      # highlighted words of one meaning (related words, a phrase)
  reciter: alafasy                    # one of `reciters`; QURAN_REELS_RECITER overrides it
  rotation:                           # reciter chosen per passage (src/quran_reels/reciters.py)
    reciters: [omar_hisham, minshawi, ghamdi, rifai, sayegh, budair]   # ties: this order
    avoid_last: 2                     # not one of the last 2 published, unless none else fits
  # One MP3 per ayah from EveryAyah (id: its folder), so the text follows the recitation
  # exactly. Planning durations: Quran.com timings of the same recording (timings_id), or the
  # file sizes (constant bitrate, kbps). basmala: the file recited before a surah.
  # The first Facebook reel (Alafasy, 2026-11-05) was cut by Rights Manager: every reel is now
  # checked by Meta before it is published (publishers/rights.py).
  reciters:
    alafasy:
      id: Alafasy_128kbps
      label: Mishary Rashid Alafasy
      hashtags: ["#Alafasy", "#مشاري_العفاسي"]
      timings_id: 7
      rights: "aucune licence connue ; reconnu par Rights Manager sur Facebook (2026-11-05)"
    # Recorded by the King Fahd Complex (Hafs, its own recordings with the Madinah Mushaf).
    hudhaifi:
      id: Hudhaify_128kbps
      label: Ali Al-Hudhaifi
      producer: King Fahd Complex
      hashtags: ["#Hudhaifi", "#علي_الحذيفي"]
      kbps: 128
      basmala: bismillah              # same audio as its 1:1
      rights: "Complexe du Roi Fahd, licence d'usage gratuit (qurancomplex.gov.sa)"
    ayyoub:
      id: Muhammad_Ayyoub_128kbps
      label: Muhammad Ayyub
      producer: King Fahd Complex
      hashtags: ["#MuhammadAyyub", "#محمد_أيوب"]
      kbps: 128
      basmala: "001001"               # its bismillah.mp3 lasts 2.9 s: cut
      rights: "Complexe du Roi Fahd, licence d'usage gratuit (qurancomplex.gov.sa)"
    akhdar:
      id: Ibrahim_Akhdar_32kbps       # only 32 kb/s mono on EveryAyah
      label: Ibrahim Al-Akhdar
      producer: King Fahd Complex
      hashtags: ["#IbrahimAlAkhdar", "#إبراهيم_الأخضر"]
      kbps: 32
      basmala: "001001"               # no bismillah.mp3
      rights: "Complexe du Roi Fahd, licence d'usage gratuit (qurancomplex.gov.sa)"
    # One file per surah only (no per-ayah source exists): split on the pauses
    # (sources/surah_audio.py). Slow, melodic style: surah 93 lasts 5 min 24 s (Alafasy 55 s).
    omar_hisham:
      id: omar-hisham-al-arabi        # archive.org item (islamicbulletin.org upload, 320 kb/s)
      surah_url: "https://archive.org/download/omar-hisham-al-arabi/{surah:03d}.mp3"
      split_max_minutes: 15           # his slow recordings (93: 5 min, 89: 9 min) rarely fit
      label: Omar Hisham Al-Arabi
      hashtags: ["#OmarHisham", "#عمر_هشام_العربي"]
      basmala: "001001"               # Al-Fatiha's first ayah
      rights: "aucune licence connue ; copies archive.org par des tiers ; diffusé sur Apple Music et Spotify : risque Rights Manager"
    # mp3quran.net: one file per surah and the ayah timings (ayat_timing, read id), split and
    # checked the same way (2026-11-05: the owner's choice, with Omar Hisham). Pace, Alafasy = 1.
    minshawi:                         # 1.16
      id: minshawi-murattal
      surah_url: "https://cdn.mp3quran.net/audio/muhammad-minshawi/r1/{surah:03d}.mp3"
      mp3quran: 112
      label: Muhammad Siddiq Al-Minshawi
      hashtags: ["#Minshawi", "#المنشاوي"]
      basmala: "001001"
      rights: "aucune licence connue ; mp3quran.net"
    ghamdi:                           # 0.79
      id: saad-ghamdi
      surah_url: "https://cdn.mp3quran.net/audio/saad-ghamdi/r1/{surah:03d}.mp3"
      mp3quran: 30
      label: Saad Al-Ghamdi
      hashtags: ["#SaadAlGhamdi", "#سعد_الغامدي"]
      basmala: "001001"
      rights: "aucune licence connue ; mp3quran.net"
    rifai:                            # 0.78
      id: nabil-rifai
      surah_url: "https://cdn.mp3quran.net/audio/nabil-rifai/r1/{surah:03d}.mp3"
      mp3quran: 87
      label: Nabil Ar-Rifai
      hashtags: ["#NabilArRifai", "#نبيل_الرفاعي"]
      basmala: "001001"
      rights: "aucune licence connue ; mp3quran.net"
    sayegh:                           # 0.76
      id: tawfeeq-sayegh
      surah_url: "https://cdn.mp3quran.net/audio/tawfeeq-sayegh/r1/{surah:03d}.mp3"
      mp3quran: 17
      label: Tawfiq As-Sayegh
      hashtags: ["#TawfiqAsSayegh", "#توفيق_الصايغ"]
      basmala: "001001"
      rights: "aucune licence connue ; mp3quran.net"
    budair:                           # 0.79
      id: salah-budair
      surah_url: "https://cdn.mp3quran.net/audio/salah-budair/r1/{surah:03d}.mp3"
      mp3quran: 43
      label: Salah Budair
      hashtags: ["#SalahBudair", "#صلاح_البدير"]
      basmala: "001001"
      rights: "aucune licence connue ; mp3quran.net"
  basmala:
    enabled: true                     # recited and shown at the start of every video
    audio: bismillah                  # EveryAyah file of the reciter: bismillah.mp3
    skip_surahs: [9]                  # At-Tawbah has no basmala (also none before 1:1, it is 1:1)
  passage:
    mode: complete                    # never cut a passage mid-sentence
    target_seconds: 60                # about one minute
    min_seconds: 40
    max_seconds: 90                   # Facebook Reels API limit
    whole_surah: true                 # a surah that fits in max_seconds is one video, any length
    groups: en-tafisr-ibn-kathir      # Quran.com tafsir whose ayah groups are never split (sic)

video:
  width: 1080
  height: 1920
  fps: 30
  safe_area: { top: 250, bottom: 420, sides: 90 }
  highlight_color: "#f6c86b"
  lead_seconds: 0.4                   # first ayah on screen before the recitation starts
  tail_seconds: 1.2                   # last ayah stays after it ends
  fade_seconds: 0.25                  # ayah text fades in and out
  handle: "@quran_words_daily"        # page signature shown on every frame

platforms:
  meta:
    graph_version: v24.0              # Graph API version, Facebook and Instagram
    min_days_left: 14                 # fail when the token's data access expires sooner
  facebook:  { enabled: true,  mode: auto, max_hashtags: 8 }
  instagram: { enabled: true,  mode: auto, max_hashtags: 5 }   # Instagram's cap since 12/2025
  tiktok:
    enabled: true                     # tiktok-auth saved TIKTOK_REFRESH_TOKEN (2026-11-04)
    mode: draft                       # inbox upload, posted by hand from the TikTok app
    max_hashtags: 5                   # TikTok accepts 5 (seen by the owner, 2026-11-05)
    redirect_uri: https://mssnoussi92.github.io/quran-reels/tiktok-callback.html
  youtube:   { enabled: false, mode: manual }  # locked private until the YouTube audit

# Hashtags at the end of every caption, in this order (the first ones are kept when a platform
# allows fewer): brand, broad[0], the series' first tag, the surah (#SurahAdDuhaa,
# #سورة_الضحى, from Quran.com's names), the other broad tags, the other series tags, the
# reciter's, the glosses' (content.*.hashtags). caption.txt keeps them all (TikTok, YouTube).
captions:
  brand: "#QuranWordsDaily"           # on every video, so that the series can be found
  broad: ["#Quran", "#القرآن_الكريم"]

# When and what to publish: config/schedule.yaml (slots) and config/series/ (series).
