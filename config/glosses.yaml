# Editorial choices for word meanings. The gloss text itself is never edited here.
#
# headwords: which words of the source's quotation are highlighted in the ayah and shown in
# the box. By default it is the whole quotation, minus the particles at its edges
# («فَإِنْ عُثِرَ» → عُثِرَ). Ibn Qutaybah often quotes some context before the difficult word;
# to highlight only that word, write the quotation as the source gives it and the word(s):
#
#   "S:A":
#     "<quotation, as in the source>": "<word(s) to highlight>"

headwords:
  "93:2":                                   # as in the validated mockup
    "وَاللَّيْلِ إِذَا سَجَى": "سَجَى"
