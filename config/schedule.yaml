# When and what the daily workflow publishes. Editorial choices: change here, not in the code.

enabled: true              # first real post done on 2026-11-05 (publish-test run #12, 93:1-11)
timezone: Europe/Paris     # slot times below are local times there (summer time included)

pause:                     # days without a reel: nothing published, no slot counted as missed;
  from: 2026-11-12         # the queues wait (owner's choice, 2026-11-12: the theme episodes start;
                           # from that evening's slot on, the morning's reel already out)
  until: 2026-11-12        # last day without a reel; empty: until the owner turns them back on.
                           # Back on 2026-11-13 (owner): that evening's slot, then mornings only
                           # (slots below). Keep the block a few days: the run would otherwise
                           # count the last days of the pause as missed.

# From 2026-11-14 (owner's choice, 2026-11-13): a reel every morning, and the theme series on
# Sunday evenings only. `days` of a slot: the periods it publishes (from, until, weekdays; each
# optional; none: every day). Outside them a slot is not due, not shown, never a missed slot.
slots:
  morning:
    time: "07:30"          # before work and school; 09:30 in Mecca, 06:30 in Casablanca
    queue: reading
    days:
      - from: 2026-11-14   # its 2026-11-13 slot was still paused (back with that evening's)
  evening:
    time: "19:30"          # after work, the busiest hours on Reels; 21:30 in Mecca
    queue: themes
    days:
      - until: 2026-11-13  # every evening until then (that Friday: Al-Kahf 18:15-16)
      - from: 2026-11-14   # then Sunday evenings only: the theme series go on
        weekdays: [sunday]

fridays:                   # on Fridays the slots read Surah Al-Kahf (owner's choice, 2026-11-05)
  morning: kahf            # from 2026-11-20 the morning goes on with the surah, one passage a
                           # Friday, where the evening left it (owner, 2026-11-13; before: 18:1-10
                           # every Friday morning, queue kahf-first-ten, no longer used)
  evening: kahf            # the surah from 18:11, one passage a Friday (no Friday evening reel
                           # after 2026-11-13: the evening slot is on Sundays only)

queues:                    # the series of each queue, played one after the other
  reading: [juz-amma, mushaf]
  themes: [ayat-al-kursi, munjiyat, dua, rizq, sabr, tawba]
  kahf-first-ten: [kahf-first-ten]
  kahf: [al-kahf]

fallback:                  # a queue that is done hands over to another (add series before!)
  themes: reading

published_by_hand:         # posted outside the calendar: never published again by it
  - "93:1-11"              # publish-test run #12, Facebook and Instagram, 2026-11-05

early_minutes: 20          # a run up to 20 min before the slot time takes the slot
window_hours: 3            # after 3 h the slot is missed for the day (GitHub can be late)
