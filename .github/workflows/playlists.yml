name: playlists

# The channel's YouTube playlists (src/quran_reels/playlists.py, config/playlists.yaml): each night,
# when the statistics have read the channel (insights), every video published since the owner handed
# his playlists over (2026-11-21) goes into its playlists, at the end; a series without a playlist gets
# its own with its first video; his six titles are turned Arabic first once. Owner's choice,
# 2026-11-21 (« reprends les miennes et ajoute s'il n'existe pas »).
#
# Its own token, YOUTUBE_PLAYLISTS_REFRESH_TOKEN (youtube-login.html → Playlists, workflow
# youtube-auth): Google's only scope that writes playlists, which could also change or delete videos;
# this step alone reads it, and the code calls playlists and playlistItems only. Without it, nothing
# is done. By hand: Actions → playlists → Run workflow (dry_run: print what would be done).
on:
  workflow_run:
    workflows: [insights]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be done, change nothing"
        type: boolean
        default: false

permissions:
  contents: write          # the state branch (youtube-playlists.json: the playlists it made)

concurrency:
  group: youtube-playlists
  cancel-in-progress: false

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt

jobs:
  file:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04     # pinned, as the other workflows
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package
        run: pip install -e .

      - name: Load the state
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state:state
            git worktree add state-branch state
          else
            git worktree add --orphan -b state state-branch
          fi

      - name: File the new videos
        env:                   # secrets for this step only
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_PLAYLISTS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_PLAYLISTS_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            quran-reels youtube-playlists --state state-branch --dry-run
          else
            quran-reels youtube-playlists --state state-branch
          fi

      - name: Save the state
        if: inputs.dry_run != true
        working-directory: state-branch
        run: |
          [ -f youtube-playlists.json ] || exit 0
          bash "$GITHUB_WORKSPACE/.github/scripts/save-state.sh" "Playlists" youtube-playlists.json
