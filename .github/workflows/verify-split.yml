# Temporary: checks a per-surah reciter's split by speech recognition (Hugging Face models
# are not reachable from the development container). Removed once the method is settled.
name: verify-split
on:
  push:
    branches: [claude/friendly-sagan-qyo1qg]
    paths: [.github/workflows/verify-split.yml, scripts/verify_split.py]
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (no apt: the Ubuntu mirror is slow today)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers imageio-ffmpeg -e .
          mkdir -p ~/bin && ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/bin/ffmpeg
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Verify
        run: python scripts/verify_split.py 114 1
