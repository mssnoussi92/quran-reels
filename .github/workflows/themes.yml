name: themes

# The theme videos of quran-themes-demo on the Page (docs/themes.md; owner's decision 2026-11-15):
# the day's video of docs/retention/calendar.md at 18:00 Paris (19:00 until 2026-11-19), from the public pre-release
# page-<doc>, its texts word for word from publication-<doc>.md. Facebook and Instagram only
# after Meta's copyright check (anything but clear: nothing goes out, TikTok included); TikTok
# its own version as a draft in the inbox; YouTube by hand (the captions issue gives the file).
# Nothing before config/themes.yaml `from` (the owner publishes those by hand).
#
# Started by the scheduler session at 17:40 Paris, Monday to Saturday, not by GitHub's cron.
# By hand: a dry run of a given day (dry_run + day): upload, Meta's checks, the Facebook copy
# deleted, nothing public, no TikTok draft, nothing recorded.
#
# `page: ma3ak`: the test page « معاك 5 ثواني » instead (owner's request, 2026-11-19: every day at
# 18:00, started by the scheduler session at 17:42 Paris, after the Page's run): config/themes-ma3ak.yaml, its own state
# (themes-ma3ak.json), its own failure issue, Facebook and Instagram only, with the secret
# META_PAGE_TOKEN_5 and nothing else (its Page and Instagram account are read from the token). That
# step never sees the Page's secrets, and the Page's step never sees this one: a missing token
# fails the run, it can never post the test page's video on the Page.
on:
  workflow_dispatch:
    inputs:
      page:
        description: "main: the Page (calendar.md, 18:00); ma3ak: the test page (calendar-ma3ak.md, 18:00)"
        type: choice
        options: [main, ma3ak]
        default: main
      dry_run:
        description: "Dry run (nothing public, state unchanged)"
        type: boolean
        default: false
      day:
        description: "Dry run only: that day's video, e.g. 2026-11-24"
        required: false
      platforms:
        description: "Dry run only: e.g. facebook,instagram (empty: all)"
        required: false

permissions:
  contents: write          # the state branch (themes.json)
  issues: write            # failure alert, captions to copy (quran-reels notify)

concurrency:
  group: accounts          # never two runs posting at the same time (reels, images, themes)
  cancel-in-progress: false

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 75    # a 9:16 film is sent twice to Facebook (unpublished, then published);
                           # then the 16:9 one to YouTube, waited for while YouTube processes it
    env:
      STATE_FILE: ${{ inputs.page == 'ma3ak' && 'themes-ma3ak.json' || 'themes.json' }}
      SETTINGS: ${{ inputs.page == 'ma3ak' && 'config/themes-ma3ak.yaml' || 'config/themes.yaml' }}
      GITHUB_TOKEN: ${{ github.token }}      # only to list quran-themes-demo's texts (public)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package
        run: pip install -e .

      - name: ffmpeg
        run: |
          # The Instagram copy is re-encoded without edit list (themepub/run.py, for_instagram).
          # Static build of imageio-ffmpeg, as in daily.yml (no apt).
          pip install -q imageio-ffmpeg==0.8.1
          mkdir -p ~/bin
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/bin/ffmpeg
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ~/bin/ffmpeg -version | head -1

      - name: Load the state
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state:state
            git worktree add state-branch state
          else
            git worktree add --orphan -b state state-branch
          fi

      - name: What is due
        id: due
        if: inputs.dry_run != true
        run: quran-reels themes run --settings "$SETTINGS" --state "state-branch/$STATE_FILE" --check

      - name: Post
        id: post
        if: inputs.page != 'ma3ak' && (inputs.dry_run == true || steps.due.outputs.due == 'true')
        env:                   # secrets for this step only
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          # YouTube (config/themes.yaml, publishers/youtube.py): upload and read, never change nor
          # delete (youtube-login.html → Uploads, workflow youtube-auth).
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_UPLOAD_REFRESH_TOKEN: ${{ secrets.YOUTUBE_UPLOAD_REFRESH_TOKEN }}
          DAY: ${{ inputs.day }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
            [ -n "$DAY" ] && args+=(--day "$DAY")
            for p in ${PLATFORMS//,/ }; do args+=(--platform "$p"); done
          fi
          quran-reels themes run --settings "$SETTINGS" --state "state-branch/$STATE_FILE" "${args[@]}"

      # The test page: its own token only. Facebook and Instagram (config/themes-ma3ak.yaml).
      - name: Post on the test page
        id: post_ma3ak
        if: inputs.page == 'ma3ak' && (inputs.dry_run == true || steps.due.outputs.due == 'true')
        env:                   # this secret only, for this step only
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN_5 }}
          META_IDS_FROM_TOKEN: "1"
          DAY: ${{ inputs.day }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
            [ -n "$DAY" ] && args+=(--day "$DAY")
            for p in ${PLATFORMS//,/ }; do args+=(--platform "$p"); done
          fi
          quran-reels themes run --settings "$SETTINGS" --state "state-branch/$STATE_FILE" "${args[@]}"

      - name: Save the state
        if: always() && inputs.dry_run != true && steps.due.outputs.due == 'true'
        working-directory: state-branch
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/save-state.sh" "Themes ($STATE_FILE)" "$STATE_FILE"

      # The page publier.html (src/quran_reels/feed.py): the TikTok text of the draft, and YouTube's
      # link (or its file and texts when the upload did not happen), on a fixed link. Never fails.
      - name: The page « À publier »
        if: always() && inputs.page != 'ma3ak' && inputs.dry_run != true && steps.due.outputs.due == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: quran-reels themes files --report out/themes-report.json

      - name: Tell the owner
        if: always() && inputs.dry_run != true && steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
          ALERT: ${{ inputs.page == 'ma3ak' && 'ma3ak' || 'themes' }}
        run: quran-reels notify --alert "$ALERT" --outcome "$OUTCOME" --run-url "$RUN_URL" --owner "$OWNER" --report out/themes-report.json
