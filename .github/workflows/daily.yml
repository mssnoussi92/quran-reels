name: daily-reel

# Two videos a day (config/schedule.yaml): 07:30 and 19:30 Paris time, Al-Kahf on Fridays.
# GitHub's schedule is in UTC and often late, so each slot gets three runs, an hour apart,
# covering summer and winter time; `quran-reels daily` decides what is due and retries the
# platforms that failed. Nothing is published while schedule.yaml says enabled: false.
on:
  schedule:
    # Changed from :13 on 2026-11-05: GitHub never fired the first schedule (05:13, 06:13 and
    # 07:13 UTC skipped); editing the cron line registers it again.
    - cron: "17 5,6,7 * * *"      # morning slot: 07:17 Paris + two retries, winter or summer
    - cron: "17 17,18,19 * * *"   # evening slot: 19:17 Paris + two retries
  workflow_dispatch:
    inputs:
      passage:
        description: "Only render this passage, e.g. 93 or 2:1-5 (nothing is published)"
        required: false
      dry_run:
        description: "Run the schedule now as a dry run (drafts, state unchanged, no TikTok)"
        type: boolean
        default: false
      now:
        description: "Dry run only: pretend it is this time, e.g. 2026-11-05T07:20+01:00"
        required: false

permissions:
  contents: write          # the state branch (what was published where)
  issues: write            # failure alert and captions to copy (quran-reels notify)

concurrency:
  group: accounts          # never two runs posting at the same time (see publish-test)
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-24.04     # pinned: Chromium finds its libraries; ubuntu-latest is moving to 26.04
    # 2026-11-05: the Ubuntu mirror took 39 min to install ffmpeg (no apt since). Room for the
    # other try of a platform in the same run (config/project.yaml, platforms.retry).
    timeout-minutes: 75
    env:
      STATE: state-branch/published.json
      QURAN_REELS_SPLITS: state-branch/splits   # checked splits (prepare workflow)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the package
        run: pip install -e .

      # The state lives on its own branch, so that the daily commits stay out of main.
      - name: Load the publication state
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state:state
            git worktree add state-branch state
          else
            git worktree add --orphan -b state state-branch
          fi

      - name: What is due
        id: due
        if: inputs.passage == ''
        env:
          NOW: ${{ inputs.now }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            quran-reels daily --state "$STATE" --check --force ${NOW:+--now "$NOW"}
          else
            quran-reels daily --state "$STATE" --check
          fi

      - name: Install ffmpeg and Chromium
        if: inputs.passage != '' || steps.due.outputs.due == 'true'
        run: |
          # No apt for ffmpeg: the Ubuntu mirror took 39 min on 2026-11-05 and stalled the evening
          # run. Static build of imageio-ffmpeg (pip, pinned: ffmpeg 9.0.2, libx264, aac); no
          # ffprobe needed.
          pip install -q imageio-ffmpeg==0.8.1
          mkdir -p ~/bin
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/bin/ffmpeg
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ~/bin/ffmpeg -version | head -1
          # Chromium: the runner image has its libraries (it ships Chrome); apt only if it
          # does not start.
          python -m playwright install chromium
          python -c "from playwright.sync_api import sync_playwright as p; pw = p().start(); pw.chromium.launch().close(); pw.stop()" \
            || python -m playwright install --with-deps chromium
      # The cache fills up as passages are rendered: restore the latest here, save a new one
      # at the end, also when the run failed (run #29, 2026-11-09: 9 min 28 to fetch everything
      # again for a TikTok upload alone, the failed run #28 having saved nothing).
      - uses: actions/cache/restore@v5
        if: inputs.passage != '' || steps.due.outputs.due == 'true'
        with:
          path: .cache
          key: data-${{ hashFiles('config/project.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: data-${{ hashFiles('config/project.yaml') }}-

      - name: Render a given passage
        if: inputs.passage != ''
        env:
          PASSAGE: ${{ inputs.passage }}
        run: quran-reels render "$PASSAGE"

      - name: Publish the slots due now
        if: inputs.passage == '' && steps.due.outputs.due == 'true'
        env:                   # secrets for this step only, not for the installs above
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          NOW: ${{ inputs.now }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}    # an approved Pixabay clip, first use
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            quran-reels daily --state "$STATE" --dry-run --force ${NOW:+--now "$NOW"}
          else
            quran-reels daily --state "$STATE"
          fi

      # Pushed even when another run pushed to the state branch meanwhile (the on-demand preview
      # saves its splits outside the `accounts` group): a slot not recorded is published again.
      - name: Save the publication state
        if: always() && inputs.passage == '' && (steps.due.outputs.due == 'true' || steps.due.outputs.missed != '')
        working-directory: state-branch
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/save-state.sh" "État" published.json

      # Direct downloads for the phone (docs/on-demand.md): each reel that went out is put in
      # the release `reels` (not zipped, no sign-in), with a page giving the YouTube title,
      # description and hashtags; the captions issue links them. Never fails the run.
      - name: Direct downloads (MP4, YouTube page)
        if: always() && inputs.passage == '' && steps.due.outputs.due == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: quran-reels on-demand daily-files --report out/daily-report.json

      # A failure opens an issue assigned to the owner (push notification in the GitHub app),
      # closed by the next run that publishes; captions to copy go to a pinned issue. So does a
      # slot no run ever took (`missed`, seen by any later run, GitHub's late cron included:
      # until then nothing told the owner, the alert being written by the run that never came).
      - name: Tell the owner
        if: always() && inputs.passage == '' && (steps.due.outputs.due == 'true' || steps.due.outputs.missed != '' || failure())
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
          MISSED: ${{ steps.due.outputs.missed }}
        run: quran-reels notify --outcome "$OUTCOME" --run-url "$RUN_URL" --owner "$OWNER" --missed "$MISSED"

      - name: Save the cache (downloads, clips)
        if: always() && (inputs.passage != '' || steps.due.outputs.due == 'true')
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .cache
          key: data-${{ hashFiles('config/project.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the video
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reel
          path: |
            out/*.mp4
            out/*/caption.txt
            out/*/tiktok.mp4
            out/youtube/*.mp4
            out/youtube/*/caption.txt
            out/*/manifest.json
            out/*/publish.json
            out/*/preview/*.png
          if-no-files-found: ignore
          retention-days: 14
