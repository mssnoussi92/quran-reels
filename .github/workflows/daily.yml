name: daily-reel

on:
  workflow_dispatch:
    inputs:
      passage:
        description: "Surah or passage to render, e.g. 93 or 2:1-5 (empty = today's pick)"
        required: false
  # schedule:            # enabled once v1 is validated
  #   - cron: "17 5 * * *"

permissions:
  contents: write        # commit state/ after publishing

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -e .
          python -m playwright install --with-deps chromium
      # The cache fills up as passages are rendered: restore the latest, save a new one.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: data-${{ hashFiles('config/project.yaml') }}-${{ github.run_id }}
          restore-keys: data-${{ hashFiles('config/project.yaml') }}-
      - name: Render a given passage
        if: inputs.passage != ''
        env:
          PASSAGE: ${{ inputs.passage }}
        run: quran-reels render "$PASSAGE"
      - name: Run
        if: inputs.passage == ''
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: quran-reels run
      - name: Keep the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            out/*.mp4
            out/*/caption.txt
            out/*/manifest.json
            out/*/preview/*.png
          if-no-files-found: ignore
          retention-days: 14
