name: prepare-splits

# Each night, the passages of the coming week are split into ayahs and checked by speech
# recognition for every reciter of content.rotation (`quran-reels split --upcoming`), so
# that the daily run finds them ready: it chooses only among reciters checked for the
# passage. The splits (times only) go to the state branch, splits/<reciter>/SSS.json.
# Red only when a passage has no reciter ready at all (it would not be published).
# Started by the scheduler session (02:41 Paris), not by GitHub's cron, which came 6 to 7 hours
# late, after the morning slot, and only repeated the night's run.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead"
        required: false
        default: "8"

permissions:
  contents: write          # the state branch

# Its own group: it posts nothing and uses no platform token, so it has no reason to hold the
# `accounts` group for its 7 to 150 minutes, nor to take its one waiting place. It shares the
# state branch with the publishing runs, which save-state.sh makes safe (a commit is replayed
# when the branch moved); it writes splits/, they write published.json and images.json.
concurrency:
  group: prepare
  cancel-in-progress: false

env:
  # What changes the render or the recognition is installed at the versions of constraints.txt.
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      QURAN_REELS_SPLITS: state-branch/splits
      DAYS: ${{ inputs.days || '8' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Speech recognition on CPU (torch ~200 MB from PyTorch's index); ffmpeg is the static
      # build of imageio-ffmpeg: analysis only, no apt (the Ubuntu mirror can be very slow).
      - name: Install
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -e ".[asr]" imageio-ffmpeg==0.8.1
          mkdir -p ~/bin
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/bin/ffmpeg
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Load the state branch
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state:state
            git worktree add state-branch state
          else
            git worktree add --orphan -b state state-branch
          fi
      - uses: actions/cache@v5       # recordings and the model, from one night to the next
        with:
          path: |
            .cache
            ~/.cache/huggingface
          key: prepare-${{ github.run_id }}
          restore-keys: prepare-
      - name: Split and check the coming week
        run: quran-reels split --upcoming "$DAYS" --state state-branch/published.json
      - name: Save the splits
        if: always()
        working-directory: state-branch
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/save-state.sh" "Découpes" splits
