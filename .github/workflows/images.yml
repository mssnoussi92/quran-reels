name: images

# Daily image posts on Instagram and Facebook (docs/images.md): Word of the day carousel.
# The time of each format is in config/images.yaml (UTC); `quran-reels images run --check`
# decides whether one is due. A day's post is chosen once (state branch: images.json); a
# platform that failed is retried with the same images while the window lasts.
#
# Started by the scheduler session (11:36 UTC), not by GitHub's cron: the hourly cron this file
# had fired late and at random (16 runs for 94 ticks in four days, never at :41), posted nothing,
# and each of its runs took the one waiting place of the `accounts` group: on 2026-11-09 at
# 22:40 UTC it cancelled a run that was waiting there (prepare-splits #10). A queued publication
# would have been cancelled the same way, without a job and so without an alert.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run as a dry run now (nothing posted, state unchanged)"
        type: boolean
        default: false
      now:
        description: "Dry run only: pretend it is this time, e.g. 2026-11-06T11:35+00:00"
        required: false

permissions:
  contents: write          # the state branch (images.json)
  issues: write            # failure alert (quran-reels notify)

concurrency:
  group: accounts          # never two runs posting at the same time (reels, images, tests)
  cancel-in-progress: false

env:
  # What changes the render or the recognition is installed at the versions of constraints.txt.
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STATE: state-branch/images.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package
        run: pip install -e .

      - name: Load the state
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state:state
            git worktree add state-branch state
          else
            git worktree add --orphan -b state state-branch
          fi

      - name: What is due
        id: due
        env:
          NOW: ${{ inputs.now }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            quran-reels images run --state "$STATE" --check ${NOW:+--now "$NOW"}
          else
            quran-reels images run --state "$STATE" --check
          fi

      - name: Install Chromium
        if: steps.due.outputs.due == 'true'
        run: |
          # Chromium: the runner image has its libraries (it ships Chrome); apt only if it
          # does not start.
          python -m playwright install chromium
          python -c "from playwright.sync_api import sync_playwright as p; pw = p().start(); pw.chromium.launch().close(); pw.stop()" \
            || python -m playwright install --with-deps chromium
      - uses: actions/cache@v6
        if: steps.due.outputs.due == 'true'
        with:
          path: .cache
          key: images-${{ hashFiles('config/project.yaml') }}-${{ github.run_id }}
          restore-keys: images-${{ hashFiles('config/project.yaml') }}-

      - name: Post
        if: steps.due.outputs.due == 'true'
        env:                   # secrets for this step only
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          NOW: ${{ inputs.now }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            quran-reels images run --state "$STATE" --dry-run ${NOW:+--now "$NOW"}
          else
            quran-reels images run --state "$STATE"
          fi

      - name: Save the state
        if: always() && steps.due.outputs.due == 'true'
        working-directory: state-branch
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/save-state.sh" "Images" images.json

      - name: Tell the owner
        if: always() && steps.due.outputs.due == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: quran-reels notify --outcome "$OUTCOME" --run-url "$RUN_URL" --owner "$OWNER" --report out/images-report.json

      - name: Keep the images
        if: always() && steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: images
          path: out/images/
          if-no-files-found: ignore
          retention-days: 14
