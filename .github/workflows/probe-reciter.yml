# Temporary: looks for Omar Hisham's recordings from a runner (this container cannot reach
# archive.org). Removed once the source is chosen.
name: probe-reciter
on:
  push:
    branches: [claude/friendly-sagan-qyo1qg]
    paths: [.github/workflows/probe-reciter.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Probe
        shell: python
        run: |
          import json, re, subprocess, urllib.request
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "quran-reels/0.1"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()
          for ident in ("OmarHishamAl-Arabi_murattel", "Omar-Hisham", "omar-hisham-al-arabi",
                        "OmarHishamAl-Arabi", "omar-hisham-al-arabi-whole"):
              print("\n==", ident)
              try:
                  d = json.loads(get(f"https://archive.org/metadata/{ident}"))
              except Exception as e:
                  print(" ", type(e).__name__, e); continue
              m = d.get("metadata", {})
              for k in ("title", "creator", "uploader", "publicdate", "licenseurl", "rights"):
                  print(f"  {k}: {m.get(k)}")
              print("  description:", re.sub(r"\s+", " ", str(m.get("description")))[:400])
              mp3 = [f for f in d.get("files", []) if f["name"].lower().endswith(".mp3")]
              print("  mp3 files:", len(mp3), [f["name"] for f in mp3[:5]], "...")
              f93 = [f for f in mp3 if re.search(r"(^|\D)0*93(\D|$)", f["name"])]
              for f in f93[:2]:
                  print("  93:", f["name"], f.get("size"), "bytes", f.get("length"), "s", f.get("bitrate"))
              if not f93:
                  continue
              name = f93[0]["name"]
              open("/tmp/a.mp3", "wb").write(get(f"https://archive.org/download/{ident}/{urllib.request.quote(name)}"))
              info = subprocess.run(["ffprobe", "-v", "error", "-show_entries",
                                     "format=duration,bit_rate:stream=sample_rate,channels", "-of",
                                     "compact", "/tmp/a.mp3"], capture_output=True, text=True).stdout
              print("  probe:", info.replace("\n", " | "))
              for noise in ("-35dB", "-30dB"):
                  out = subprocess.run(["ffmpeg", "-nostdin", "-i", "/tmp/a.mp3", "-af",
                                        f"silencedetect=noise={noise}:d=0.35", "-f", "null", "-"],
                                       capture_output=True, text=True).stderr
                  starts = [float(x) for x in re.findall(r"silence_start: ([\d.]+)", out)]
                  ends = [float(x) for x in re.findall(r"silence_end: ([\d.]+)", out)]
                  sil = [(round(a, 2), round(b - a, 2)) for a, b in zip(starts, ends)]
                  print(f"  silences {noise} (start, length):", len(sil), sil)
