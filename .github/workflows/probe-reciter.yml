# Temporary: looks for Omar Hisham's recordings from a runner (this container cannot reach
# archive.org). Removed once the source is chosen.
name: probe-reciter
on:
  push:
    branches: [claude/friendly-sagan-qyo1qg]
    paths: [.github/workflows/probe-reciter.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Probe
        shell: python
        run: |
          import json, re, subprocess, urllib.request
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "quran-reels/0.1"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read()
          ident = "omar-hisham-al-arabi"
          d = json.loads(get(f"https://archive.org/metadata/{ident}"))
          files = {f["name"]: f for f in d["files"] if f["name"].endswith(".mp3")}
          print("surahs:", sorted(files))
          for name in sorted(files):
              n = int(name[:3])
              if n >= 78 or n == 1:
                  print(f"  {name}: {float(files[name].get('length', 0)):.1f} s")
          for name in ("112.mp3", "113.mp3", "114.mp3", "108.mp3", "103.mp3", "001.mp3"):
              if name not in files or float(files[name].get("length", 999)) > 130:
                  continue
              open("/tmp/a.mp3", "wb").write(get(f"https://archive.org/download/{ident}/{name}"))
              for noise, dd in (("-35dB", 0.3), ("-30dB", 0.2)):
                  out = subprocess.run(["ffmpeg", "-nostdin", "-i", "/tmp/a.mp3", "-af",
                                        f"silencedetect=noise={noise}:d={dd}", "-f", "null", "-"],
                                       capture_output=True, text=True).stderr
                  starts = [float(x) for x in re.findall(r"silence_start: (-?[\d.]+)", out)]
                  ends = [float(x) for x in re.findall(r"silence_end: ([\d.]+)", out)]
                  print(f"  {name} {noise}:", [(round(a, 2), round(b - a, 2)) for a, b in zip(starts, ends)])
