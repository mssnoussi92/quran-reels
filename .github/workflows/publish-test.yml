name: publish-test

# Manual test of the publishers.
#   dry-run  Facebook: reel left as a draft (Meta Business Suite → Content → Drafts).
#            Instagram: container uploaded and processed, not published (dropped after 24 h).
#            TikTok: draft mode either way, the reel goes to the TikTok inbox, never public.
#   publish  really posts on Facebook and Instagram. Type PUBLIER in "confirm" to allow it.
# Every run checks the Meta Page token first and fails if its data access expires in < 14 days.
# TikTok needs the tiktok-auth workflow to have run once (TIKTOK_REFRESH_TOKEN).
# Rights: the reel is uploaded unpublished first and Meta's copyright check is read; the run
# summary gives each platform's answer. `reciters` tries several recitations in one dry run.
# what: images runs `quran-reels images run --dry-run` at today's slot (always a dry run here).

on:
  workflow_dispatch:
    inputs:
      passage:
        description: "Surah or passage, e.g. 93 or 2:1-5"
        required: true
        default: "93"
      mode:
        description: "dry-run (nothing public) or publish (really posts)"
        type: choice
        options: [dry-run, publish]
        default: dry-run
      platforms:
        description: "Where"
        type: choice
        options: [facebook+instagram, facebook, instagram, tiktok, facebook+instagram+tiktok]
        default: facebook+instagram
      confirm:
        description: "For mode publish only: type PUBLIER"
        required: false
        default: ""
      reciters:
        description: "Dry run: reciters to try one after the other, e.g. hudhaifi,ayyoub,akhdar (empty: the configured one)"
        required: false
        default: ""
      what:
        description: "reel, or images (dry run of today's Word of the day: photos, carousel, nothing posted)"
        type: choice
        options: [reel, images]
        default: reel
      instagram_from:
        description: "Instagram's video: our upload (its fallback: Facebook's copy), or Facebook's copy only (to test the fallback)"
        type: choice
        options: [upload, facebook-copy]
        default: upload

permissions:
  contents: read

concurrency:
  group: accounts            # never two runs using the same accounts or tokens at once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04     # pinned: Chromium finds its libraries; ubuntu-latest is moving to 26.04
    timeout-minutes: 75       # several reciters, each waiting for Meta's copyright check
    env:                       # secrets: only in the steps that use them, below
      PASSAGE: ${{ inputs.passage }}
      MODE: ${{ inputs.mode }}
      PLATFORMS: ${{ inputs.platforms }}
      CONFIRM: ${{ inputs.confirm }}
      RECITERS: ${{ inputs.reciters }}
      WHAT: ${{ inputs.what }}
      QURAN_REELS_INSTAGRAM_FROM: ${{ inputs.instagram_from }}
      QURAN_REELS_SPLITS: state-branch/splits   # checked splits (prepare workflow)
    steps:
      - name: Confirm a real publication
        if: inputs.mode == 'publish'
        run: |
          if [ "$CONFIRM" != "PUBLIER" ]; then
            echo "::error::mode publish: type PUBLIER in the confirm field to post for real."
            exit 1
          fi
          if [ "$(echo "$RECITERS" | tr ',+' '  ' | wc -w)" -gt 1 ]; then
            echo "::error::mode publish: one reciter at most (several would post several times)."
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Load the checked splits (state branch)
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state:state
            git worktree add state-branch state
          fi
      - name: Check the Meta token
        if: contains(inputs.platforms, 'facebook') || contains(inputs.platforms, 'instagram')
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          set -- $(echo "$PLATFORMS" | tr '+' '\n' | grep -v tiktok | sed 's/^/--platform /')
          quran-reels meta-check "$@"
      - name: Install ffmpeg and Chromium
        run: |
          # No apt for ffmpeg: the Ubuntu mirror took 39 min on 2026-11-05 and stalled the evening
          # run. Static build of imageio-ffmpeg (pip, pinned: ffmpeg 9.0.2, libx264, aac); no
          # ffprobe needed.
          pip install -q imageio-ffmpeg==0.8.1
          mkdir -p ~/bin
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/bin/ffmpeg
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ~/bin/ffmpeg -version | head -1
          # Chromium: the runner image has its libraries (it ships Chrome); apt only if it
          # does not start.
          python -m playwright install chromium
          python -c "from playwright.sync_api import sync_playwright as p; pw = p().start(); pw.chromium.launch().close(); pw.stop()" \
            || python -m playwright install --with-deps chromium
      - uses: actions/cache@v5
        with:
          path: .cache
          key: data-${{ hashFiles('config/project.yaml') }}-${{ github.run_id }}
          restore-keys: data-${{ hashFiles('config/project.yaml') }}-
      - name: Render and publish
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}   # saves TikTok's new refresh token
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}    # an approved Pixabay clip, first use
        run: |
          if [ "$WHAT" = "images" ]; then
            slot=$(python -c "import yaml; print(yaml.safe_load(open('config/images.yaml'))['formats']['word']['time_utc'])")
            quran-reels images run --state /tmp/images-dry-run.json --dry-run \
              --now "$(date -u +%Y-%m-%d)T${slot}:00+00:00"
            exit $?
          fi
          set -- $(echo "$PLATFORMS" | tr '+' ' ' | sed 's/[^ ]*/--platform &/g')
          if [ "$MODE" = "dry-run" ]; then set -- "$@" --dry-run; fi
          list=$(echo "$RECITERS" | tr ',+' '  ')
          if [ -z "$list" ]; then quran-reels publish "$PASSAGE" "$@"; exit $?; fi
          status=0                  # every reciter is tried, each in its own out/<reciter>/
          for r in $list; do
            echo "::group::$r"
            QURAN_REELS_RECITER="$r" quran-reels publish "$PASSAGE" "$@" || status=1
            mkdir -p "results/$r" && mv out/* "results/$r/"
            echo "::endgroup::"
          done
          mv results/* out/
          exit $status
      - name: Keep the video and the results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: publish-${{ inputs.mode }}
          path: |
            out/**/*.mp4
            out/**/caption.txt
            out/**/manifest.json
            out/**/publish.json
            out/images/
          if-no-files-found: ignore
          retention-days: 14
